<script>
/* ============ 单页外壳：册 -> 章 -> 方程 三级导航 ============ */
(function () {
    'use strict';

    var BOOKS = [];      // [{book, chapters:[{title, reactions:[]}]}]
    var curBook = 0, curChap = 0, player = null;

    // ---------- 工具 ----------
    function $(id) { return document.getElementById(id); }
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }
    // 把 LaTeX/Unicode 方程转成可搜索的纯文本
    function plainEq(s) {
        return String(s || '')
            .replace(/\\mathrm\s*\{/g, ' ').replace(/\\text\s*\{/g, ' ')
            .replace(/\\[a-zA-Z]+/g, ' ')
            .replace(/[_^{}&]/g, ' ')
            .replace(/\s+/g, ' ').trim();
    }

    // ---------- 构建导航 ----------
    function buildBookRow() {
        var row = $('book-row');
        row.innerHTML = '';
        BOOKS.forEach(function (b, i) {
            var n = b.chapters.reduce(function (s, c) { return s + c.reactions.length; }, 0);
            var el = document.createElement('button');
            el.className = 'tab-btn px-4 py-2 rounded-xl text-sm font-semibold border transition-colors cursor-pointer whitespace-nowrap ' +
                (i === curBook ? 'tab-active' : 'tab-idle');
            el.textContent = b.book + '（' + n + '）';
            el.onclick = function () { selectBook(i); };
            row.appendChild(el);
        });
    }

    function buildChapterRow() {
        var row = $('chapter-row');
        row.innerHTML = '';
        var book = BOOKS[curBook];
        if (!book) return;
        book.chapters.forEach(function (c, i) {
            var el = document.createElement('button');
            el.className = 'chap-btn px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors cursor-pointer whitespace-nowrap ' +
                (i === curChap ? 'chap-active' : 'chap-idle');
            el.textContent = c.title + '（' + c.reactions.length + '）';
            el.onclick = function () { selectChapter(i); };
            row.appendChild(el);
        });
    }

    // ---------- 切换 ----------
    function selectBook(i) {
        if (i === curBook) return;
        curBook = i; curChap = 0;
        buildBookRow(); buildChapterRow(); mount();
        saveHash();
    }

    function selectChapter(i) {
        if (i === curChap) return;
        curChap = i;
        buildChapterRow(); mount();
        saveHash();
    }

    // 挂载当前章节的播放器
    function mount(eqIdx) {
        var book = BOOKS[curBook];
        if (!book) return;
        var chap = book.chapters[curChap];
        if (!chap || !chap.reactions.length) return;

        if (player) { try { player.destroy(); } catch (e) {} player = null; }
        // 清掉上一次的残留 DOM
        $('card-row').innerHTML = '';
        $('stepper').innerHTML = '';
        $('conservation-chips').innerHTML = '';
        $('legend-grid').innerHTML = '';
        $('labels-overlay').innerHTML = '';

        player = window.ChemPlayer.create(chap.reactions);
        player.start();
        if (typeof eqIdx === 'number' && eqIdx > 0) player.switchReaction(eqIdx);

        // 面包屑
        $('page-title').textContent = book.book + ' · ' + chap.title;
        $('eq-count').textContent = '第 ' + (curChap + 1) + '/' + book.chapters.length + ' 章 · 共 ' + chap.reactions.length + ' 个反应';
        document.title = book.book + ' · ' + chap.title + ' · 微观 3D 可视化';
    }

    // ---------- 搜索 ----------
    function allReactions() {
        var out = [];
        BOOKS.forEach(function (b, bi) {
            b.chapters.forEach(function (c, ci) {
                c.reactions.forEach(function (r, ri) {
                    out.push({ bi: bi, ci: ci, ri: ri, r: r, book: b.book, chap: c.title });
                });
            });
        });
        return out;
    }

    function runSearch(q) {
        var box = $('search-results');
        q = (q || '').trim().toLowerCase();
        if (!q) { box.innerHTML = '<div class="p-6 text-center text-xs text-slate-400">输入关键字搜索，如「氯气」「电解」「置换」</div>'; return; }

        var hits = allReactions().filter(function (it) {
            var r = it.r;
            var hay = [
                plainEq(r.meta && r.meta.equation), r.card,
                (r.labels || []).map(function (l) { return l.text; }).join(' '),
                it.book, it.chap
            ].join(' ').toLowerCase();
            return hay.indexOf(q) >= 0;
        }).slice(0, 80);

        if (!hits.length) { box.innerHTML = '<div class="p-6 text-center text-xs text-slate-400">没有匹配的方程</div>'; return; }

        box.innerHTML = hits.map(function (it) {
            return '<button class="w-full text-left px-4 py-2.5 hover:bg-slate-50 transition-colors cursor-pointer" data-bi="' + it.bi + '" data-ci="' + it.ci + '" data-ri="' + it.ri + '">' +
                '<div class="text-[10px] text-slate-400 mb-0.5">' + esc(it.book) + ' · ' + esc(it.chap) + '</div>' +
                '<div class="text-sm text-slate-700 font-medium">' + esc(it.r.card || plainEq(it.r.meta && it.r.meta.equation)) + '</div>' +
                '</button>';
        }).join('');

        box.querySelectorAll('button').forEach(function (b) {
            b.onclick = function () {
                curBook = +b.dataset.bi; curChap = +b.dataset.ci;
                buildBookRow(); buildChapterRow(); mount(+b.dataset.ri);
                saveHash(); closeSearch();
            };
        });
    }

    function openSearch() {
        $('search-overlay').classList.remove('hidden');
        $('search-input-2').value = $('search-input').value || '';
        $('search-input-2').focus();
        runSearch($('search-input-2').value);
    }
    function closeSearch() { $('search-overlay').classList.add('hidden'); }

    // 当前章节的方程数
    function curCount() {
        var b = BOOKS[curBook];
        if (!b) return 0;
        var c = b.chapters[curChap];
        return c ? c.reactions.length : 0;
    }

    // ---------- 深链：#册/章/方程 ----------
    function saveHash() {
        var eq = player ? player.index : 0;
        try { history.replaceState(null, '', '#' + curBook + '/' + curChap + '/' + eq); } catch (e) {}
    }
    function loadHash() {
        var m = (location.hash || '').replace(/^#/, '').split('/');
        if (m.length === 3) {
            var b = +m[0], c = +m[1], r = +m[2];
            if (BOOKS[b] && BOOKS[b].chapters[c]) { curBook = b; curChap = c; return r || 0; }
        }
        return 0;
    }

    // ---------- 启动 ----------
    function boot() {
        BOOKS = (window.CHEM_DATA && window.CHEM_DATA.__books) || [];
        if (!BOOKS.length) {
            document.body.innerHTML = '<div class="p-10 text-sm text-slate-500">数据未加载：请确认数据脚本已包含。</div>';
            return;
        }
        var total = BOOKS.reduce(function (s, b) {
            return s + b.chapters.reduce(function (t, c) { return t + c.reactions.length; }, 0);
        }, 0);
        var chaps = BOOKS.reduce(function (s, b) { return s + b.chapters.length; }, 0);
        $('global-count').textContent = BOOKS.length + ' 册 · ' + chaps + ' 章 · ' + total + ' 个方程';

        var eqIdx = loadHash();
        buildBookRow(); buildChapterRow(); mount(eqIdx);

        // 卡片切换时同步 URL
        var row = $('card-row');
        row.addEventListener('click', function () { setTimeout(saveHash, 0); }, true);

        // 搜索
        $('search-input').addEventListener('focus', openSearch);
        $('search-input-2').addEventListener('input', function (e) { runSearch(e.target.value); });
        $('search-close').onclick = closeSearch;
        $('search-overlay').addEventListener('click', function (e) { if (e.target === $('search-overlay')) closeSearch(); });

        // 选择栏（分册 / 章节 / 方程卡片 三行）整体收起，状态记在本地
        var navBox = $('nav-collapse'), collapsed = false;
        try { collapsed = localStorage.getItem('chem.nav.collapsed') === '1'; } catch (e) {}
        function applyCollapse() {
            navBox.classList.toggle('hidden', collapsed);
            $('collapse-icon').style.transform = collapsed ? 'rotate(-90deg)' : '';
            $('collapse-text').textContent = collapsed ? '展开' : '收起';
            $('collapse-toggle').title = (collapsed ? '展开' : '收起') + ' 选择栏（快捷键 H）';
            try { localStorage.setItem('chem.nav.collapsed', collapsed ? '1' : '0'); } catch (e) {}
            // 视口高度变了，通知 3D 重算画布尺寸
            setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 40);
        }
        $('collapse-toggle').onclick = function () { collapsed = !collapsed; applyCollapse(); };
        applyCollapse();

        // 键盘统一入口：Esc 关闭 / Ctrl+K 搜索 / H 收起选择栏 / ← → 切换方程
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeSearch();
            if (e.key === 'k' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openSearch(); }
            var ae = document.activeElement;
            if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
            if (e.key === 'h' || e.key === 'H') { collapsed = !collapsed; applyCollapse(); return; }
            if (!player || !$('search-overlay').classList.contains('hidden')) return;
            if (e.key === 'ArrowRight') { player.switchReaction(Math.min(curCount() - 1, player.index + 1)); saveHash(); }
            if (e.key === 'ArrowLeft') { player.switchReaction(Math.max(0, player.index - 1)); saveHash(); }
        });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
})();
</script>
</body>
</html>
